<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f33"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background Badge: dark rounded squircle for high visibility on all tab themes -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- The Eye (Trinetra) -->
  <path d="M4 16C7 10.5 11 8 16 8s9 2.5 12 8c-3 5.5-7 8-12 8s-9-2.5-12-8Z" fill="none" stroke="url(#eyeGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Iris Ring -->
  <circle cx="16" cy="16" r="4.2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <!-- Pupil -->
  <circle cx="16" cy="16" r="2.5" fill="#38bdf8"/>
  <!-- Reflection highlight -->
  <circle cx="17.2" cy="14.8" r="0.9" fill="#ffffff"/>
  <!-- Trinetra Third Eye Beacon Dot (Top Center) -->
  <circle cx="16" cy="4.5" r="1.3" fill="#38bdf8"/>
</svg>